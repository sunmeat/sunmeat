<svg width="500" height="120" viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .win { fill: #0d1117; }
      .bar { fill: #161b22; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #8b949e; }
      .prompt { font-family: 'SF Mono', 'Fira Code', Consolas, monospace; font-size: 16px; }
      .user { fill: #5BB0F7; }
      .path { fill: #a5d6ff; }
      .cmd { fill: #e6edf3; }
      .cursor { fill: #e6edf3; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="499" height="119" rx="10" class="win" />
  <rect x="0.5" y="0.5" width="499" height="119" rx="10" class="border" />

  <path d="M0.5 10 a10 10 0 0 1 10 -9.5 h478 a10 10 0 0 1 10 9.5 v28 h-498 z" class="bar" />
  <line x1="0.5" y1="38.5" x2="499.5" y2="38.5" stroke="#30363d" stroke-width="1" />

  <circle cx="24" cy="19" r="6" class="dot-red" />
  <circle cx="44" cy="19" r="6" class="dot-yellow" />
  <circle cx="64" cy="19" r="6" class="dot-green" />

  <text x="250" y="24" text-anchor="middle" class="title">sunmeat — terminal</text>

  <text x="20" y="72" class="prompt">
    <tspan class="user">➜</tspan>
    <tspan class="path"> ~ </tspan>
    <tspan class="cmd">npx sunmeat</tspan>
  </text>

  <rect x="203" y="60" width="9" height="16" class="cursor">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite" />
  </rect>
</svg>
